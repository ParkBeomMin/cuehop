<body>
<div id="root">
  <div id="stage">
    <canvas id="game" aria-label="Game"></canvas>
    <div id="hud" hidden>
      <div class="hud-top">
        <div id="hud-room" class="pill room"><b id="hud-room-n">R01</b><span id="hud-room-name"></span></div>
        <div class="hud-right">
          <div id="hud-deaths" class="pill"><canvas class="pic" data-ic="x" aria-hidden="true"></canvas><b id="hud-deaths-v">0</b></div>
          <div id="hud-time" class="pill"><canvas class="pic" data-ic="clock" aria-hidden="true"></canvas><b id="hud-time-v">0.0</b></div>
          <button id="btn-pause" class="icon-btn" type="button" aria-label="Pause"><span class="pause-ic"></span></button>
        </div>
      </div>
      <div class="hud-help">
        <button id="btn-rehearsal" class="btn small help" type="button" hidden><span data-t="ui.rehearsal"></span></button>
        <button id="btn-skip" class="btn small help" type="button" hidden data-t="ui.skip"></button>
      </div>
      <p id="hud-tip" class="tip" hidden></p>
    </div>
    <div id="controls" class="controls" hidden aria-hidden="true">
      <div class="pad pad-move"><button id="btn-left" class="cbtn" type="button" tabindex="-1" data-b="left"><i class="tri l"></i></button><button id="btn-right" class="cbtn" type="button" tabindex="-1" data-b="right"><i class="tri r"></i></button></div>
      <div class="pad pad-jump"><button id="btn-jump" class="cbtn jump" type="button" tabindex="-1" data-b="jump"><i class="tri u"></i><span data-t="ui.jump" id="jump-label">JUMP</span></button></div>
    </div>
  </div>
  <section id="screen-title" class="screen" hidden>
    <div class="title-inner">
      <div class="logo-wrap"><canvas id="logo" width="120" height="26" aria-hidden="true"></canvas><p id="logo-ko" class="logo-ko" aria-hidden="true"></p></div>
      <h1 id="app-name" class="sr"></h1>
      <p class="tagline" data-t="ui.tagline"></p>
      <button id="title-play" class="btn primary big" type="button"></button>
      <div class="row2"><button id="title-rooms" class="btn" type="button" data-t="ui.rooms"></button><button id="title-wardrobe" class="btn" type="button"><canvas class="bic" data-ic="clap" aria-hidden="true"></canvas><span data-t="ui.wardrobe"></span></button></div>
      <button id="title-settings" class="btn" type="button" data-t="ui.settings"></button>
      <p id="title-progress" class="goal"></p>
      <p id="title-controls" class="controls-hint"></p>
      <p id="credits" class="credits"></p>
    </div>
  </section>
  <section id="screen-rooms" class="screen" hidden>
    <header class="bar"><button id="rooms-back" class="btn small" type="button" data-t="ui.back"></button><h2 data-t="rooms.title"></h2><span id="rooms-total" class="totals"></span></header>
    <div id="rooms-list" class="scroll"></div>
  </section>
  <section id="screen-wardrobe" class="screen" hidden>
    <header class="bar"><button id="ws-back" class="btn small" type="button" data-t="ui.back"></button><h2 data-t="ws.title"></h2><span id="ws-applause" class="totals"></span></header>
    <p class="ws-note" data-t="ws.note"></p>
    <div id="ws-list" class="scroll"></div>
  </section>
  <div id="card-clear" class="overlay result-ov" hidden>
    <div class="panel result" role="dialog" aria-modal="true" aria-labelledby="res-title">
      <div class="res-head">
        <div class="res-ribbon"><h2 id="res-title"></h2></div>
        <p id="res-room" class="res-detail"></p>
        <div class="res-stars"><div class="rstar" id="rs-0"><canvas aria-hidden="true"></canvas><span data-t="res.star1"></span></div><div class="rstar" id="rs-1"><canvas aria-hidden="true"></canvas><span data-t="res.star2"></span></div><div class="rstar" id="rs-2"><canvas aria-hidden="true"></canvas><span id="rs-2-label"></span></div></div>
        <p id="res-badge" class="res-badge" hidden></p>
      </div>
      <div class="res-body">
        <ul class="res-rows">
          <li class="rrow"><canvas class="ric" data-ic="clock" aria-hidden="true"></canvas><span class="rl" data-t="res.time"></span><b id="res-time" class="rv"></b></li>
          <li class="rrow"><canvas class="ric" data-ic="x" aria-hidden="true"></canvas><span class="rl" data-t="res.deaths"></span><b id="res-deaths" class="rv"></b></li>
          <li class="rrow"><canvas class="ric" data-ic="clock" aria-hidden="true"></canvas><span class="rl" data-t="res.best"></span><b id="res-best" class="rv"></b></li>
          <li class="rrow"><canvas class="ric" data-ic="clap" aria-hidden="true"></canvas><span class="rl" data-t="res.applause"></span><b id="res-applause" class="rv"></b></li>
        </ul>
        <div class="res-actions">
          <button id="res-menu" class="btn sec" type="button" data-t="res.menu"></button>
          <button id="res-retry" class="btn sec" type="button" data-t="res.retry"></button>
          <button id="res-next" class="btn primary next" type="button"><span id="res-next-label" data-t="res.next"></span><i class="next-arrow" aria-hidden="true"></i></button>
        </div>
        <p class="rhint" data-t="res.rhint"></p>
      </div>
    </div>
  </div>
  <div id="overlay-pause" class="overlay" hidden>
    <div class="panel" role="dialog" aria-modal="true"><h2 data-t="ui.pause"></h2>
      <div class="col"><button id="pause-resume" class="btn primary" type="button" data-t="ui.resume"></button><button id="pause-restart" class="btn" type="button" data-t="ui.restart"></button><button id="pause-settings" class="btn" type="button" data-t="ui.settings"></button><button id="pause-quit" class="btn" type="button" data-t="ui.quit"></button></div>
    </div>
  </div>
  <div id="overlay-settings" class="overlay" hidden>
